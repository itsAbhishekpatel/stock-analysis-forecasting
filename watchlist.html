{% extends "base.html" %}

{% block title %}Watchlist - Indian Stock Analyzer{% endblock %}

{% block extra_css %}
<style>
    .watch-card { border-left: 4px solid #6c757d; transition: border-color .2s ease; }
    .watch-card.up { border-left-color: #198754; }
    .watch-card.down { border-left-color: #dc3545; }
    .change-up { color: #198754; font-weight: 600; }
    .change-down { color: #dc3545; font-weight: 600; }
    #searchSuggestions {
        position: absolute;
        z-index: 1000;
        width: 100%;
        max-height: 220px;
        overflow-y: auto;
        display: none;
    }
    #addStockWrapper { position: relative; }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h2 class="mb-0">⭐ My Watchlist</h2>
    <button class="btn btn-outline-primary btn-sm" id="refreshWatchlistBtn">🔄 Refresh Prices</button>
</div>

<div class="row mb-4">
    <div class="col-md-6" id="addStockWrapper">
        <div class="input-group">
            <input type="text" class="form-control" id="addStockInput" placeholder="Add a stock symbol (e.g. RELIANCE)" autocomplete="off">
            <button class="btn btn-primary" id="addStockBtn">+ Add</button>
        </div>
        <div class="list-group" id="searchSuggestions"></div>
    </div>
</div>

<div id="watchlistAlert" class="alert d-none" role="alert"></div>

<div id="watchlistContainer" class="row g-3"></div>

<div id="watchlistEmptyState" class="text-center text-muted py-5 d-none">
    <p class="mb-1">Your watchlist is empty.</p>
    <p class="small">Add a stock symbol above to start tracking it.</p>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/watchlist.js') }}"></script>
{% endblock %}
