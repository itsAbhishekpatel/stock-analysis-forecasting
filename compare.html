{% extends "base.html" %}

{% block title %}Compare Stocks - Indian Stock Analyzer{% endblock %}

{% block extra_css %}
<style>
    .compare-input-wrapper { position: relative; }
    .compare-suggestions {
        position: absolute;
        z-index: 1000;
        width: 100%;
        max-height: 200px;
        overflow-y: auto;
        display: none;
    }
    .metric-better { color: #198754; font-weight: 600; }
    .metric-worse { color: #dc3545; }
</style>
{% endblock %}

{% block content %}
<h2 class="mb-4">⚖️ Compare Stocks</h2>

<div class="row g-2 mb-3">
    <div class="col-md-4 compare-input-wrapper">
        <input type="text" class="form-control" id="symbolInput1" placeholder="First symbol (e.g. RELIANCE)" autocomplete="off">
        <div class="list-group compare-suggestions" id="suggestions1"></div>
    </div>
    <div class="col-md-4 compare-input-wrapper">
        <input type="text" class="form-control" id="symbolInput2" placeholder="Second symbol (e.g. TCS)" autocomplete="off">
        <div class="list-group compare-suggestions" id="suggestions2"></div>
    </div>
    <div class="col-md-4">
        <button class="btn btn-primary w-100" id="compareBtn">Compare</button>
    </div>
</div>

<div id="compareAlert" class="alert alert-warning d-none"></div>

<div id="compareResults" class="d-none">
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div id="priceChart" style="width:100%; height:400px;"></div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body table-responsive">
            <table class="table table-hover align-middle mb-0" id="compareTable">
                <thead>
                    <tr id="compareTableHead"></tr>
                </thead>
                <tbody id="compareTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="compareLoading" class="text-center py-5 d-none">
    <div class="spinner-border text-primary"></div>
    <p class="text-muted mt-2">Fetching comparison data...</p>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/compare.js') }}"></script>
{% endblock %}
